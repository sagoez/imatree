[package]
name = "imatree"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A simple command line tool to generate aesthetically pleasing (and sometimes not so pleasing) images of whatever string you want."
license = "MIT"
repository = "https://github.com/sagoez/imatree"
readme = "README.md"
authors = ["Samuel <swe@sagoez.com>"]
keywords = ["image-generation", "text-rendering", "cli", "graphics", "png"]
categories = ["command-line-utilities", "graphics", "text-processing"]
exclude = [".github", ".gitignore", "sample"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
text-to-png = "0.3.0"
thiserror = "2.0.20"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
